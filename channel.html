<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Channel - YouTube Clone</title>
    <link rel="stylesheet" href="./css/cold.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.0.1/remixicon.css"
      integrity="sha512-ZH3KB6wI5ADHaLaez5ynrzxR6lAswuNfhlXdcdhxsvOUghvf02zU1dAsOC6JrBTWbkE1WNDNs5Dcfz493fDMhA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="header">
      <div class="logo-contenedor">
        <i class="ri-menu-line"></i>
        <div class="logo">
          <div class="logo-svg">
            <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="25" height="25" viewBox="0 0 48 48">
              <path fill="#FF3D00" d="M43.2,33.9c-0.4,2.1-2.1,3.7-4.2,4c-3.3,0.5-8.8,1.1-15,1.1c-6.1,0-11.6-0.6-15-1.1c-2.1-0.3-3.8-1.9-4.2-4C4.4,31.6,4,28.2,4,24c0-4.2,0.4-7.6,0.8-9.9c0.4-2.1,2.1-3.7,4.2-4C12.3,9.6,17.8,9,24,9c6.2,0,11.6,0.6,15,1.1c2.1,0.3,3.8,1.9,4.2,4c0.4,2.3,0.9,5.7,0.9,9.9C44,28.2,43.6,31.6,43.2,33.9z"></path>
              <path fill="#FFF" d="M20 31L20 17 32 24z"></path>
            </svg>
          </div>
          <h1 id="logo-txt">Youtube</h1>
        </div>
      </div>
      <div class="contenedor-busqueda">
        <form action="" id="search-form">
          <input type="text" placeholder="search" id="search-input" />
        </form>
        <div class="boton-busqueda" id="search-button"><i class="ri-search-line"></i></div>
        <div class="boton-mic"><i class="ri-mic-fill"></i></div>
      </div>
      <div class="perfil-contenedor">
        <i class="fa-solid fa-upload"></i>
        <i class="fa-regular fa-bell"></i>
        <i class="fa-regular fa-user"></i>
      </div>
    </div>

    <div class="division" style="padding-top: 75px;">
      <div class="principal" style="color:#fff;">
        <div class="canal" style="gap: 12px;">
          <img id="channel-avatar" src="" width="80" height="80" alt="avatar" style="border-radius:50%;" />
          <div>
            <h1 id="channel-name" style="margin:0 0 6px 0; font-size:1.6rem;"></h1>
            <div id="channel-subs" style="color:#717171;"></div>
          </div>
          <div class="botones">
            <button class="suscripcion">Suscribirme</button>
            <button class="compartir"><i class="ri-share-forward-line"></i>Compartir</button>
          </div>
        </div>
      </div>
      <div class="principal" style="padding-top:0;">
        <div id="channel-tabs" style="display:flex; gap:14px; color:#fff; border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:10px;">
          <div class="tab active" data-tab="videos" style="cursor:pointer;">Videos</div>
          <!-- Futuras tabs: Listas, Directos, Acerca de -->
        </div>
        <div id="channel-grid" style="margin-top:16px;"></div>
      </div>
    </div>

    <script src="./js/data.js"></script>
    <script src="./js/channel.js"></script>
  </body>
</html>
